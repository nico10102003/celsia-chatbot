[project]
name = "celsia-chatbot"
version = "1.0.0"
description = "Chatbot corporativo de Celsia basado en RAG, scraping web y modelos de lenguaje"
readme = "README.md"
license = "MIT"
authors = [
    { name = "nico10102003", email = "nicolas.bolanos@uao.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "trafilatura>=2.3.1",
]

[project.scripts]
celsia-chatbot = "celsia_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

